name: wearsy_mobile
description: "WEARSY Smart Wardrobe & AI Fashion Assistant Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.1
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  flutter_secure_storage: ^9.0.0
  mailer: ^7.2.0
  image_picker: ^1.2.3
  crypto: ^3.0.3
  flutter_windowmanager_plus: ^1.1.1
  speech_to_text: ^7.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
