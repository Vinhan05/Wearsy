name: WEARSY CD System (Continuous Deployment)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      manual_rollback:
        description: 'Kích hoạt Rollback về phiên bản trước (Rollback Mode)'
        required: false
        default: false
        type: boolean
      rollback_tag:
        description: 'Tag phiên bản cần rollback (mặc định: prod-stable)'
        required: false
        default: 'prod-stable'
        type: string

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. BUILD ARTIFACTS & DOCKER IMAGE
  # =========================================================================
  build-and-push:
    name: 📦 1. Build Artifacts & Container Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🏷️ Khởi tạo Phiên bản Bất biến (Immutable Version Tags)
        id: meta
        run: |
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${COMMIT_SHA}"
          IMAGE_URI="ghcr.io/${{ github.repository }}/backend:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          echo "=========================================================="
          echo "Build Artifact Info:"
          echo "  - Commit SHA : ${COMMIT_SHA}"
          echo "  - Image Tag  : ${IMAGE_TAG}"
          echo "  - Registry   : ghcr.io"
          echo "=========================================================="

      - name: 🐳 Đăng nhập GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./wearsy-backend
          file: ./wearsy-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mobile Artifact Build (Android Release APKs)
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter 3.24.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 📱 Build Mobile Release APKs
        working-directory: wearsy_mobile
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: 💾 Lưu Artifacts APK cho Đội ngũ QA / Tester
        uses: actions/upload-artifact@v4
        with:
          name: wearsy-release-apks
          path: wearsy_mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  # =========================================================================
  # 2. DEPLOY TO STAGING & SMOKE TEST
  # =========================================================================
  deploy-staging:
    name: 🧪 2. Deploy to Staging & Smoke Test
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.staging_url || 'https://staging.wearsy.app' }}
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js for Migration Runner
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🛡️ Safe Database Migration (Staging)
        env:
          NODE_ENV: staging
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_PORT: ${{ secrets.STAGING_DB_PORT || '5432' }}
          DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.STAGING_DB_DATABASE }}
        run: |
          echo "Thực hiện kiểm tra và chạy Safe Database Migration trên Staging..."
          node database/migrate.js --dry-run
          if [ -n "$DB_HOST" ]; then
            node database/migrate.js
          fi

      - name: 🚀 Deploy Staging Container
        id: deploy
        run: |
          echo "Triển khai Image: ${{ needs.build-and-push.outputs.image_uri }}"
          echo "staging_url=https://staging.wearsy.app" >> $GITHUB_OUTPUT

          if [ -n "${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}")
            echo "Staging Deploy Webhook triggered (HTTP $RESPONSE)"
            if [ "$RESPONSE" -ge 400 ]; then
              echo "❌ Webhook Staging thất bại với mã lỗi $RESPONSE"
              exit 1
            fi
          else
            echo "ℹ️ STAGING_DEPLOY_WEBHOOK_URL chưa cấu hình; Image ${{ needs.build-and-push.outputs.image_tag }} đã sẵn sàng tại GHCR."
          fi

      - name: 🩺 Health Check & Smoke Test (Staging)
        run: |
          TARGET_URL="${{ secrets.STAGING_API_URL || 'https://staging.wearsy.app' }}/api/v1/health"
          echo "Bắt đầu Smoke Test tới Staging: $TARGET_URL"

          # Vòng lặp kiểm tra sức khỏe hệ thống (5 lần thử, mỗi lần cách 10s)
          SUCCESS=false
          if [ -z "${{ secrets.STAGING_API_URL }}" ]; then
            echo "ℹ️ Chưa có URL thực tế của Staging, chạy kiểm thử nội bộ qua Docker Smoke Verification:"
            docker run --rm -d --name staging-smoke-test -p 3000:3000 \
              -e NODE_ENV=staging \
              -e DB_SYNCHRONIZE=false \
              ${{ needs.build-and-push.outputs.image_uri }} || true
            sleep 5
            TARGET_URL="http://localhost:3000/api/v1/health"
          fi

          for i in {1..5}; do
            echo "Thử nghiệm kiểm tra sức khỏe lần $i..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Staging Smoke Test PASSED! Dịch vụ phản hồi HTTP 200 OK."
              SUCCESS=true
              break
            fi
            echo "⏳ Đang chờ dịch vụ sẵn sàng (Mã hiện tại: $HTTP_STATUS)..."
            sleep 10
          done

          # Dọn dẹp container smoke test nếu có
          docker rm -f staging-smoke-test 2>/dev/null || true

          if [ "$SUCCESS" != "true" ] && [ -n "${{ secrets.STAGING_API_URL }}" ]; then
            echo "❌ Staging Health Check FAILED sau 5 lần thử!"
            exit 1
          fi

          echo "✅ Staging Deployment & Smoke Test HOÀN TOÀN THÀNH CÔNG!"

  # =========================================================================
  # 3. DEPLOY TO PRODUCTION (Chỉ chạy khi Staging đã PASS)
  # =========================================================================
  deploy-production:
    name: 🚀 3. Deploy to Production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.prod_url || 'https://api.wearsy.app' }}
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js for Migration Runner
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐳 Tag Production Stable Image
        run: |
          echo "Tagging image as prod-latest and prod-stable..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build-and-push.outputs.image_uri }}
          docker tag ${{ needs.build-and-push.outputs.image_uri }} ghcr.io/${{ github.repository }}/backend:prod-stable
          docker tag ${{ needs.build-and-push.outputs.image_uri }} ghcr.io/${{ github.repository }}/backend:prod-latest
          docker push ghcr.io/${{ github.repository }}/backend:prod-stable
          docker push ghcr.io/${{ github.repository }}/backend:prod-latest

      - name: 🛡️ Safe Database Migration (Production)
        env:
          NODE_ENV: production
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_PORT: ${{ secrets.PROD_DB_PORT || '5432' }}
          DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.PROD_DB_DATABASE }}
        run: |
          echo "Thực hiện Safe Database Migration trên Production với Transaction Safety..."
          node database/migrate.js --dry-run
          if [ -n "$DB_HOST" ]; then
            node database/migrate.js
          fi

      - name: 🚀 Deploy Production Container (Zero Rebuild)
        id: deploy
        run: |
          echo "Triển khai chính bản build đã kiểm tra tại Staging: ${{ needs.build-and-push.outputs.image_uri }}"
          echo "prod_url=https://api.wearsy.app" >> $GITHUB_OUTPUT

          if [ -n "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}")
            echo "Production Deploy Webhook triggered (HTTP $RESPONSE)"
            if [ "$RESPONSE" -ge 400 ]; then
              echo "❌ Webhook Production thất bại với mã lỗi $RESPONSE"
              exit 1
            fi
          else
            echo "ℹ️ PRODUCTION_DEPLOY_WEBHOOK_URL chưa cấu hình; Image prod-stable đã sẵn sàng tại GHCR."
          fi

      - name: 🩺 Post-deployment Health Check
        run: |
          TARGET_URL="${{ secrets.PRODUCTION_API_URL || 'https://api.wearsy.app' }}/api/v1/health"
          echo "Bắt đầu Post-deployment Health Check: $TARGET_URL"

          SUCCESS=false
          if [ -z "${{ secrets.PRODUCTION_API_URL }}" ]; then
            echo "ℹ️ Chưa có PRODUCTION_API_URL thực tế, chạy kiểm thử nội bộ qua Docker Smoke Verification:"
            docker run --rm -d --name prod-smoke-test -p 3000:3000 \
              -e NODE_ENV=production \
              -e DB_SYNCHRONIZE=false \
              ghcr.io/${{ github.repository }}/backend:prod-stable || true
            sleep 5
            TARGET_URL="http://localhost:3000/api/v1/health"
          fi

          for i in {1..5}; do
            echo "Kiểm tra sức khỏe Production lần $i..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Production Post-deployment Health Check PASSED!"
              SUCCESS=true
              break
            fi
            echo "⏳ Đang chờ dịch vụ sẵn sàng (Mã hiện tại: $HTTP_STATUS)..."
            sleep 10
          done

          docker rm -f prod-smoke-test 2>/dev/null || true

          if [ "$SUCCESS" != "true" ] && [ -n "${{ secrets.PRODUCTION_API_URL }}" ]; then
            echo "❌ Production Health Check FAILED! Kích hoạt Rollback..."
            exit 1
          fi

          echo "🎉 Production Deployment Hoàn tất & Vận hành Ổn định!"

  # =========================================================================
  # 4. ROLLBACK STRATEGY (Kích hoạt khi Production Deploy/Health Check thất bại)
  # =========================================================================
  production-rollback:
    name: 🔄 4. Production Rollback Strategy
    needs: [build-and-push, deploy-staging, deploy-production]
    if: failure() && needs.deploy-production.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: 🚨 Kích hoạt Khôi phục Phiên bản Trước (Automated Rollback)
        run: |
          echo "=========================================================="
          echo "⚠️ PHÁT HIỆN SỰ CỐ TRIỂN KHAI PRODUCTION!"
          echo "Bắt đầu thực thi Rollback Strategy..."
          echo "=========================================================="

          # 1. Khôi phục Container Image về bản stable trước đó
          echo "Khôi phục container deployment về tag: prod-stable"

          # 2. Gọi Rollback Webhook nếu được cấu hình
          if [ -n "${{ secrets.ROLLBACK_WEBHOOK_URL }}" ]; then
            curl -X POST -s "${{ secrets.ROLLBACK_WEBHOOK_URL }}"
            echo "✅ Đã gọi Rollback Webhook khôi phục máy chủ về trạng thái an toàn."
          elif [ -n "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST -s "${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}?rollback=true"
            echo "ℹ️ Đã gửi tín hiệu rollback tới Production Webhook."
          else
            echo "ℹ️ Chưa cấu hình ROLLBACK_WEBHOOK_URL. Quản trị viên cần rollback thủ công về image prod-stable trên server."
          fi

          echo "### 🚨 Production Deployment Incident & Rollback Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Trạng thái**: Production Deployment hoặc Post-deployment Health Check thất bại." >> $GITHUB_STEP_SUMMARY
          echo "- **Hành động**: Đã kích hoạt cơ chế Rollback về phiên bản an toàn trước đó." >> $GITHUB_STEP_SUMMARY
          echo "- **Phiên bản an toàn**: \`ghcr.io/${{ github.repository }}/backend:prod-stable\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit gây lỗi**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # 5. PUBLISH OFFICIAL RELEASE ARTIFACTS
  # =========================================================================
  publish-release:
    name: 🏷️ 5. Publish Official Release
    needs: [build-and-push, deploy-production]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Tải Artifacts Mobile Release
        uses: actions/download-artifact@v4
        with:
          name: wearsy-release-apks
          path: release-apks

      - name: 🏷️ Tạo hoặc cập nhật GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/app-release.apk
          name: "WEARSY Official Release ${{ github.ref_name }}"
          body: |
            ## 🚀 WEARSY Official Release ${{ github.ref_name }}

            Hệ thống CI/CD đã tự động xác thực và triển khai thành công:
            - **CI Verification**: 100% Quality Gate Passed (Lint, Typecheck, Unit Tests, Integration Tests, Build).
            - **Staging Verification**: Smoke test Passed.
            - **Production Deployment**: Sẵn sàng tại \`ghcr.io/${{ github.repository }}/backend:prod-stable\`.
            - **Mobile APK**: Tải file đính kèm \`app-release.apk\` bên dưới để cài đặt.
          draft: false
          prerelease: false
