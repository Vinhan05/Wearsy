services:
  - type: web
    name: wearsy-backend
    runtime: node
    rootDir: apps/api-server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PREFIX
        value: v1
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: wearsy-db
          property: connectionString
      - key: AI_ORCHESTRATOR_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        value: bvxcghig
      - key: CLOUDINARY_API_KEY
        value: 597682858733949
      - key: CLOUDINARY_API_SECRET
        value: IPB7h8B-ay6CyBeb9N73cY6Fxs8

databases:
  - name: wearsy-db
    plan: free
    databaseName: wearsy_db
    user: wearsy_user
